name: habit_tracker
description: "HabitFlow - A modern habit tracking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^1.0.4
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # UI / Animations
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.1
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1

  # Google Sign-in & Drive backup
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
